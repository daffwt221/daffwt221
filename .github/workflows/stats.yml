name: Generate stats card

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate stats.svg
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&theme=dracula&hide_border=false
          path: dist/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          core_version: 2.2.0
          fail_on_error: true

      - name: Publish stats.svg
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: stats-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
